<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions · Expense Tracker</title>
    <meta name="description" content="All your income and expenses, with search and filters.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-family='Arial' font-size='58' font-weight='bold' fill='white' text-anchor='middle'>E</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div class="page-header">
        <h1>Transactions</h1>
        <button type="button" class="btn btn-primary" id="add-btn"><span aria-hidden="true">＋</span> Add transaction</button>
      </div>

      <section class="panel" aria-label="Transactions">
        <div class="toolbar">
          <div class="search">
            <label for="search" class="sr-only">Search descriptions</label>
            <svg aria-hidden="true" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
            <input type="search" id="search" placeholder="Search descriptions" autocomplete="off">
          </div>
          <label for="month-filter" class="sr-only">Month</label>
          <input type="month" id="month-filter" title="Leave empty for all months">
          <label for="type-filter" class="sr-only">Type</label>
          <select id="type-filter">
            <option value="">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <label for="category-filter" class="sr-only">Category</label>
          <select id="category-filter">
            <option value="">All categories</option>
          </select>
        </div>

        <div class="filter-totals" id="filter-totals" aria-live="polite"></div>

        <div class="table-wrap" id="table-wrap" hidden>
          <table class="table responsive">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Description</th>
                <th scope="col">Category</th>
                <th scope="col">Type</th>
                <th scope="col" class="num">Amount</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <div id="state"></div>

        <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
          <button type="button" class="btn btn-ghost" id="prev-page">← Previous</button>
          <span id="page-info" class="muted"></span>
          <button type="button" class="btn btn-ghost" id="next-page">Next →</button>
        </nav>
      </section>
    </main>

    <footer class="container footer muted">Expense Tracker · Node.js, Express &amp; MongoDB</footer>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/tx-modal.js"></script>
    <script src="/js/transactions.js"></script>
  </body>
</html>
